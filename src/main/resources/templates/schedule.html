<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><div class="shell"><aside th:replace="~{layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{layout :: header}"></header><main id="main"><div th:replace="~{layout :: alerts}"></div><p class="page-intro">Lịch học lặp lại theo tuần của các lớp trong học kỳ. Sinh viên chỉ thấy lớp đang đăng ký.</p><div th:replace="~{layout :: filters(false)}"></div><section class="panel"><div class="panel-heading"><h2>Lịch theo thứ và tiết</h2></div><div class="table-scroll"><table><thead><tr><th>Thứ</th><th>Tiết học</th><th>Lớp / môn học</th><th>Giảng viên</th><th>Phòng</th></tr></thead><tbody><tr th:each="r:${rows}"><td><span class="badge" th:text="${r.weekday == 8 ? 'Chủ nhật' : 'Thứ ' + r.weekday}"></span></td><td th:text="${r.start_period + ' – ' + (r.start_period + r.period_count - 1)}"></td><td><strong th:text="${r.code}"></strong><small class="muted block" th:text="${r.course_name}"></small></td><td th:text="${r.lecturer_name}"></td><td th:text="${r.room}"></td></tr></tbody></table></div><th:block th:if="${#lists.isEmpty(rows)}"><p th:replace="~{layout :: empty}"></p></th:block></section></main><footer>BTL Cơ sở dữ liệu · Quản lý đào tạo</footer></div></div><script th:src="@{/js/app.js}" defer></script></body></html>
