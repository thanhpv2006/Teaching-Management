<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><div class="shell"><aside th:replace="~{layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{layout :: header}"></header><main id="main"><div th:replace="~{layout :: alerts}"></div><a class="back" th:href="@{/manage}">← Quản lý danh mục</a><section class="panel"><div class="panel-heading"><h2 th:text="${title}"></h2><a class="button" th:href="@{/manage/{kind}/new(kind=${kind})}">+ Thêm mới</a></div><div class="table-scroll"><table><thead><tr><th th:each="f:${fields}" th:text="${f.label}"></th><th>Thao tác</th></tr></thead><tbody><tr th:each="r:${rows}"><td th:each="f:${fields}" th:text="${@display.cell(r[f.name],f)}"></td><td><div class="actions nowrap"><a class="button secondary small" th:href="@{/manage/{kind}/{id}/edit(kind=${kind},id=${r.id})}">Sửa</a><form method="post" th:action="@{/manage/{kind}/{id}/delete(kind=${kind},id=${r.id})}" data-confirm="Xóa bản ghi này? Dữ liệu đang được tham chiếu sẽ không thể xóa."><button class="danger small" type="submit">Xóa</button></form></div></td></tr></tbody></table></div><p class="empty" th:if="${#lists.isEmpty(rows)}">Chưa có bản ghi. Chọn “Thêm mới” để bắt đầu.</p></section><p class="help">Bản ghi có liên kết sẽ được bảo vệ bởi khóa ngoại. Xóa hồ sơ sinh viên/giảng viên không tự xóa tài khoản đăng nhập; admin có thể khóa tài khoản tại mục Tài khoản.</p></main><footer>BTL Cơ sở dữ liệu · Quản lý đào tạo</footer></div></div><script th:src="@{/js/app.js}" defer></script></body></html>
