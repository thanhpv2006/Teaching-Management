<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><div class="shell"><aside th:replace="~{layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{layout :: header}"></header><main id="main"><div th:replace="~{layout :: alerts}"></div><a class="back" th:href="@{/sections}">← Về danh sách lớp</a><section class="panel"><div class="panel-heading"><h2>Sinh viên đang học</h2><span class="badge" th:text="${#lists.size(rows) + ' sinh viên'}"></span></div><div class="table-scroll"><table><thead><tr><th>Mã SV</th><th>Họ và tên</th><th>Lớp hành chính</th><th>Lớp học phần</th><th>Ngày đăng ký</th></tr></thead><tbody><tr th:each="r:${rows}"><td th:text="${r.student_code}"></td><td th:text="${r.student_name}"></td><td th:text="${r.admin_class_code}"></td><td th:text="${r.section_code}"></td><td th:text="${r.registered_at}"></td></tr></tbody></table></div><th:block th:if="${#lists.isEmpty(rows)}"><p th:replace="~{layout :: empty}"></p></th:block></section></main><footer>BTL Cơ sở dữ liệu · Quản lý đào tạo</footer></div></div><script th:src="@{/js/app.js}" defer></script></body></html>
