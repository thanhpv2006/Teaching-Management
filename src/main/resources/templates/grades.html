<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><div class="shell"><aside th:replace="~{layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{layout :: header}"></header><main id="main"><div th:replace="~{layout :: alerts}"></div><p class="page-intro">Điểm tổng kết = chuyên cần × 10% + giữa kỳ × 30% + cuối kỳ × 60%. Đạt khi đủ điểm và tổng kết từ 4,00.</p><div th:replace="~{layout :: filters(false)}"></div><section class="panel"><div class="panel-heading"><h2>Bảng điểm</h2><span class="badge" th:text="${#lists.size(rows) + ' kết quả'}"></span></div><div class="table-scroll"><table><thead><tr><th>Sinh viên</th><th>Lớp / môn</th><th>Chuyên cần</th><th>Giữa kỳ</th><th>Cuối kỳ</th><th>Tổng kết</th><th>Kết quả</th><th th:if="${current.role == 'LECTURER'}">Thao tác</th></tr></thead><tbody><tr th:each="r:${rows}"><td><strong th:text="${r.student_code}"></strong><small class="muted block" th:text="${r.student_name}"></small></td><td><span th:text="${r.section_code}"></span><small class="muted block" th:text="${r.course_name}"></small></td><td th:text="${r.attendance_score != null ? r.attendance_score : '—'}"></td><td th:text="${r.midterm_score != null ? r.midterm_score : '—'}"></td><td th:text="${r.final_score != null ? r.final_score : '—'}"></td><td><strong th:text="${r.total_score != null ? r.total_score : '—'}"></strong></td><td><span class="badge" th:classappend="${r.grade_status == 'Đạt' ? ' good' : (r.grade_status == 'Chưa đạt' ? ' bad' : '')}" th:text="${r.grade_status}"></span></td><td th:if="${current.role == 'LECTURER'}"><a class="button secondary small" th:href="@{/lecturer/scores/{id}(id=${r.enrollment_id},semester=${semester})}">Nhập điểm</a></td></tr></tbody></table></div><th:block th:if="${#lists.isEmpty(rows)}"><p th:replace="~{layout :: empty}"></p></th:block></section></main><footer>BTL Cơ sở dữ liệu · Quản lý đào tạo</footer></div></div><script th:src="@{/js/app.js}" defer></script></body></html>
