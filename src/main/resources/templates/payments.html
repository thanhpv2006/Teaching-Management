<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><div class="shell"><aside th:replace="~{layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{layout :: header}"></header><main id="main"><div th:replace="~{layout :: alerts}"></div><p class="page-intro">Phiếu thu đã ghi nhận được giữ để đối chiếu; không sửa hoặc xóa trực tiếp.</p><div th:replace="~{layout :: filters(false)}"></div><section class="panel"><div class="panel-heading"><h2>Phiếu thu học kỳ</h2><span class="badge" th:text="${#lists.size(rows) + ' phiếu thu'}"></span></div><div class="table-scroll"><table><thead><tr><th>Mã phiếu</th><th>Sinh viên</th><th>Số tiền</th><th>Thời gian thu</th><th>Người thu</th><th>Ghi chú</th></tr></thead><tbody><tr th:each="r:${rows}"><td><strong th:text="${r.receipt_code}"></strong></td><td><span th:text="${r.student_code}"></span><small class="muted block" th:text="${r.student_name}"></small></td><td class="nowrap" th:text="${@display.money(r.amount)}"></td><td th:text="${r.paid_at}"></td><td th:text="${r.collector}"></td><td th:text="${r.note != null ? r.note : '—'}"></td></tr></tbody></table></div><th:block th:if="${#lists.isEmpty(rows)}"><p th:replace="~{layout :: empty}"></p></th:block></section></main><footer>BTL Cơ sở dữ liệu · Quản lý đào tạo</footer></div></div><script th:src="@{/js/app.js}" defer></script></body></html>
