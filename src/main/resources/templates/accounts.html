<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><div class="shell"><aside th:replace="~{layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{layout :: header}"></header><main id="main"><div th:replace="~{layout :: alerts}"></div><p class="page-intro">Tạo tài khoản sinh viên/giảng viên tại màn hình thêm hồ sơ tương ứng. Vai trò tài khoản đã liên kết được giữ nguyên.</p><section class="panel"><div class="panel-heading"><h2>Danh sách tài khoản</h2><span class="badge">Chỉ quản trị viên</span></div><div class="table-scroll"><table><thead><tr><th>Tên đăng nhập</th><th>Người dùng</th><th>Vai trò</th><th>Trạng thái</th><th>Khóa / mở</th><th>Đặt lại mật khẩu</th></tr></thead><tbody><tr th:each="r:${rows}"><td><strong th:text="${r.username}"></strong></td><td th:text="${r.display_name}"></td><td th:text="${@display.role(r.role)}"></td><td th:text="${r.active == true ? 'Hoạt động' : 'Đã khóa'}"></td><td><form th:action="@{/manage/accounts/{id}/toggle(id=${r.id})}" method="post" data-confirm="Thay đổi trạng thái truy cập của tài khoản này?"><button class="secondary small" type="submit" th:disabled="${r.id == current.id}" th:text="${r.active == true ? 'Khóa' : 'Mở khóa'}"></button></form></td><td><form th:action="@{/manage/accounts/{id}/password(id=${r.id})}" method="post" class="inline-form" data-confirm="Thay mật khẩu tài khoản này?"><input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="Mật khẩu mới" aria-label="Mật khẩu mới" required><button class="secondary small" type="submit">Đặt lại</button></form></td></tr></tbody></table></div></section></main><footer>BTL Cơ sở dữ liệu · Quản lý đào tạo</footer></div></div><script th:src="@{/js/app.js}" defer></script></body></html>
