<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><div class="shell"><aside th:replace="~{layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{layout :: header}"></header><main id="main"><div th:replace="~{layout :: alerts}"></div><a class="back" th:href="@{/grades(semester=${semester})}">← Về bảng điểm</a><section class="panel narrow"><div class="panel-heading"><h2 th:text="${row.student_code + ' · ' + row.student_name}"></h2></div><p class="muted" th:text="${row.section_code + ' · ' + row.course_name}"></p><form method="post" th:action="@{/lecturer/scores/{id}(id=${row.enrollment_id})}" class="stack" data-confirm="Lưu các điểm đang nhập? Ô trống sẽ được lưu là chưa có điểm."><input type="hidden" name="semester" th:value="${semester}"><label>Chuyên cần (10%)<input name="attendance" type="number" min="0" max="10" step="0.01" th:value="${attempt != null ? attempt['attendance'] : row.attendance_score}" placeholder="Chưa có điểm"></label><label>Giữa kỳ (30%)<input name="midterm" type="number" min="0" max="10" step="0.01" th:value="${attempt != null ? attempt['midterm'] : row.midterm_score}" placeholder="Chưa có điểm"></label><label>Cuối kỳ (60%)<input name="final" type="number" min="0" max="10" step="0.01" th:value="${attempt != null ? attempt['final'] : row.final_score}" placeholder="Chưa có điểm"></label><p class="help">Để trống để lưu trạng thái chưa có điểm. Xóa một điểm đã có sẽ đưa tổng kết về “Chưa đủ điểm”.</p><div class="actions"><button type="submit">Lưu điểm</button><a class="button secondary" th:href="@{/grades(semester=${semester})}">Quay lại</a></div></form></section></main><footer>BTL Cơ sở dữ liệu · Quản lý đào tạo</footer></div></div><script th:src="@{/js/app.js}" defer></script></body></html>
