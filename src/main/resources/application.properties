spring.application.name=Teaching Management
server.address=${BTL_SERVER_ADDRESS:127.0.0.1}
server.port=${BTL_PORT:8080}
spring.datasource.url=${BTL_DB_URL:jdbc:mysql://localhost:3306/teaching_management?connectionTimeZone=%2B07:00&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${BTL_DB_USERNAME:app_user}
spring.datasource.password=${BTL_DB_PASSWORD:}
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=never
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.format.date=yyyy-MM-dd
